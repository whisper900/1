name: Build Windows app

on:
  push:
    branches: ["main", "claude/telegram-file-downloader-aiwv03"]
  workflow_dispatch:

permissions:
  contents: write   # publish the release the app updates itself from

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt pyinstaller pytest pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Stamp version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          Set-Content -Path tgdl/_build.py -Value "VERSION = `"$version`"" -Encoding utf8
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build TelegramDownloader.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TelegramDownloader
          --icon assets/icon.ico
          --add-data "assets/icon.png;assets"
          --hidden-import cryptg
          --collect-all pypdfium2 --collect-all pypdfium2_raw --exclude-module PIL
          TelegramDownloader.py

      - name: Check that the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\TelegramDownloader.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          "{0:N1} MB" -f ((Get-Item dist\TelegramDownloader.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: TelegramDownloader-windows
          path: dist/TelegramDownloader.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $exists = $false
          try { gh release view $tag *> $null; $exists = ($LASTEXITCODE -eq 0) } catch { }
          if ($exists) {
            gh release upload $tag dist/TelegramDownloader.exe --clobber
          } else {
            gh release create $tag dist/TelegramDownloader.exe `
              --target "${{ github.sha }}" `
              --title "الإصدار $env:VERSION" `
              --notes-file release-notes.md `
              --latest
          }
